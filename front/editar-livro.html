<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Livro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Biblioteca</h1>

        <h2>Editar livro</h2>

        <form id="formEditarLivro">

            <label for="titulo">Título:</label>
            <input 
                type="text" 
                id="titulo" 
                value="Dom Casmurro"
                required
            >

            <label for="autor">Autor:</label>
            <input 
                type="text" 
                id="autor" 
                value="Machado de Assis"
                required
            >

            <label for="ano">Ano:</label>
            <input 
                type="number" 
                id="ano" 
                value="1899"
                required
            >

            <label for="categoria">Categoria:</label>
            <input 
                type="text" 
                id="categoria" 
                value="Romance"
                required
            >

            <label for="quantidade">Quantidade:</label>
            <input 
                type="number" 
                id="quantidade" 
                value="5"
                required
            >

            <button type="submit">Salvar alterações</button>

        </form>

        <br>

        <a href="livros.html">Voltar para livros</a>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
