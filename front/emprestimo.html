<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>📚 Biblioteca Digital</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastrar</a>
        <a href="livros.html">Livros</a>
        <a href="emprestimos.html">Empréstimos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main class="container">

    <h2>Registrar Empréstimo</h2>

    <form id="formEmprestimo">

        <label for="aluno">Nome do aluno</label>

        <input
            type="text"
            id="aluno"
            placeholder="Digite o nome do aluno"
            required
        >

        <label for="livroEmprestimo">Livro</label>

        <select id="livroEmprestimo" required>
            <option value="">Selecione um livro</option>
        </select>

        <label for="dataEmprestimo">
            Data do empréstimo
        </label>

        <input
            type="date"
            id="dataEmprestimo"
            required
        >

        <label for="dataDevolucao">
            Data de devolução
        </label>

        <input
            type="date"
            id="dataDevolucao"
            required
        >

        <button type="submit" class="botao">
            Registrar empréstimo
        </button>

    </form>

</main>

<footer>
    <p>© 2026 Biblioteca Digital</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
